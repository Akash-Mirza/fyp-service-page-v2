<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- FYP Desk favicon: the capital letter D (the main logo mark),
       Oxanium Ultra-Bold 26px - same as the header/footer wordmark.
       The letter sits near the baseline; the emerald dot mirrors the
       hanging dot of the DESK wordmark. -->
  <rect width="32" height="32" rx="7" fill="#0F4C81"/>
  <text
    x="16"
    y="26"
    textAnchor="middle"
    fill="#ffffff"
    fontFamily="Oxanium, sans-serif"
    fontWeight="800"
    fontSize="26"
    letterSpacing="0"
  >
    D
  </text>
  <circle cx="24.5" cy="23.5" r="3" fill="#10B981"/>
</svg>
